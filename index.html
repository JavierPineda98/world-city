<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Ciudad</title>

    <style>
        button.seleccionado {
    transform: scale(1.08);
    border: 3px solid black;
    font-weight: bold;
}
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9ecef;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        #ciudad {
            width: 700px;
            height: 450px;
            margin: 30px auto;
            background: #8bcf8b;
            border: 4px solid #333;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

   <h1>WORLD CITY</h1>

   <p>Una ciudad construida por todos. Una construcción cada día.</p>
   <p id="contadorConstrucciones">
    🌎 0 construcciones en el mundo
</p>

    <div id="ciudad"></div>

    <button id="botonCasa" onclick="seleccionarConstruccion('🏠', 'botonCasa')">
    🏠 Casa
</button>

<button id="botonArbol" onclick="seleccionarConstruccion('🌳', 'botonArbol')">
    🌳 Árbol
</button>

<button id="botonTienda" onclick="seleccionarConstruccion('🏪', 'botonTienda')">
    🏪 Tienda
</button>
<p id="estado">Puedes construir hoy.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        async function revisarSiPuedeConstruir() {

    if (!usuarioActual) {
        puedeConstruir = false;
        estado.innerText = "No se pudo identificar al usuario.";
        return;
    }

    const inicioHoy = new Date();
    inicioHoy.setUTCHours(0, 0, 0, 0);

    const inicioManana = new Date(inicioHoy);
    inicioManana.setUTCDate(inicioManana.getUTCDate() + 1);

    const { data, error } = await supabaseClient
        .from("construcciones")
        .select("id")
        .eq("user_id", usuarioActual.id)
        .gte("created_at", inicioHoy.toISOString())
        .lt("created_at", inicioManana.toISOString())
        .limit(1);

    if (error) {
        console.error("Error revisando construcción diaria:", error);
        puedeConstruir = false;
        estado.innerText = "No se pudo comprobar si puedes construir.";
        return;
    }

    puedeConstruir = data.length === 0;

    actualizarEstado();
}
const SUPABASE_URL = "https://grhlxchwuxiuvkrytlci.supabase.co";

const SUPABASE_KEY = "sb_publishable_a9q6-307OM1-G3Lp89j-oQ_EZ7ZsWML";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
let usuarioActual = null;

async function iniciarUsuario() {

    // Primero comprobamos si este navegador ya tiene una sesión
    const { data: sessionData } =
        await supabaseClient.auth.getSession();

    if (sessionData.session) {

        usuarioActual = sessionData.session.user;

        console.log(
            "Usuario existente:",
            usuarioActual.id
        );

        return;
    }

    // Si no existe una sesión, creamos un usuario anónimo
    const { data, error } =
        await supabaseClient.auth.signInAnonymously();

    if (error) {

        console.error(
            "Error creando usuario anónimo:",
            error
        );

        return;
    }

    usuarioActual = data.user;

    console.log(
        "Nuevo usuario anónimo:",
        usuarioActual.id
    );
}
async function cargarConstruccionesDesdeSupabase() {

    const { data, error } = await supabaseClient
        .from("construcciones")
        .select("*");

    if (error) {
        console.error("Error cargando construcciones:", error);
        return;
    }

    console.log("Construcciones desde Supabase:", data);

    data.forEach(construccion => {

        crearConstruccion(
            construccion.tipo,
            construccion.x,
            construccion.y
        );
       puedeConstruir = false;

construccionSeleccionada = null;

quitarSeleccionBotones();

actualizarEstado();

    });
  totalConstrucciones = data.length;

actualizarContador(totalConstrucciones);
}
let totalConstrucciones = 0;
function actualizarContador(cantidad) {

    const contador = document.getElementById(
        "contadorConstrucciones"
    );

    contador.innerText =
        "🌎 " + cantidad + " construcciones en el mundo";
}
function activarRealtime() {

    supabaseClient
        .channel("world-city-realtime")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "construcciones"
            },
            (payload) => {

                const nuevaConstruccion = payload.new;

                crearConstruccion(
                    nuevaConstruccion.tipo,
                    nuevaConstruccion.x,
                    nuevaConstruccion.y
                );
                totalConstrucciones++;

actualizarContador(totalConstrucciones);

                console.log(
                    "Nueva construcción en tiempo real:",
                    nuevaConstruccion
                );
            }
        )
        .subscribe();
}
async function iniciarJuego() {

    await iniciarUsuario();

    await cargarConstruccionesDesdeSupabase();

    await revisarSiPuedeConstruir();

    activarRealtime();

}

iniciarJuego();       let construccionSeleccionada = null;

const ciudad = document.getElementById("ciudad");
const estado = document.getElementById("estado");

// Revisar si ya construyó hoy
let puedeConstruir = false;


// Cargar construcciones guardadas

async function guardarConstruccionEnSupabase(tipo, x, y) {

 const { data, error } = await supabaseClient
    .from("construcciones")
    .insert([
        {
            tipo: tipo,
            x: x,
            y: y,
            user_id: usuarioActual.id
        }
    ])
    .select();

    if (error) {

    console.error(
        "Error guardando construcción:",
        error
    );

    if (error.code === "23505") {

        estado.innerText =
            "Ya construiste hoy. Vuelve mañana.";

        puedeConstruir = false;

    } else {

        estado.innerText =
            "Hubo un error al construir.";

    }

    return;
}

    console.log(
        "Construcción guardada:",
        data
    );

   
}
function quitarSeleccionBotones() {

    document
        .querySelectorAll("button")
        .forEach(boton => {
            boton.classList.remove("seleccionado");
        });

}


// Mostrar estado inicial
actualizarEstado();


function seleccionarConstruccion(tipo, botonId) {

   if (!puedeConstruir) {

    construccionSeleccionada = null;

    quitarSeleccionBotones();

    estado.innerText =
        "Ya construiste hoy. Vuelve mañana.";

    return;
}

    construccionSeleccionada = tipo;

    document
        .querySelectorAll("button")
        .forEach(boton => {
            boton.classList.remove("seleccionado");
        });

    const botonSeleccionado =
        document.getElementById(botonId);

    botonSeleccionado.classList.add("seleccionado");

    estado.innerText =
        "Seleccionaste " + tipo + ". Ahora elige dónde colocarlo.";
}


ciudad.onclick = function(event) {

    if (!puedeConstruir) {

        estado.innerText = "Ya construiste hoy. Vuelve mañana.";

        return;
    }

    if (construccionSeleccionada === null) {

        estado.innerText = "Primero elige qué quieres construir.";

        return;
    }


    const x = event.offsetX - 20;
    const y = event.offsetY - 20;


    guardarConstruccionEnSupabase(
    construccionSeleccionada,
    x,
    y
);


    // Registrar que ya construyó hoy
    


    puedeConstruir = false;

    construccionSeleccionada = null;

    actualizarEstado();

};


function crearConstruccion(tipo, x, y) {

    const objeto = document.createElement("div");

    objeto.innerHTML = tipo;

    objeto.style.position = "absolute";

    objeto.style.left = x + "px";

    objeto.style.top = y + "px";

    objeto.style.fontSize = "40px";

    ciudad.appendChild(objeto);

}


function actualizarEstado() {

    if (puedeConstruir) {

        estado.innerText = "Puedes construir hoy.";

    } else {

        estado.innerText = "Ya construiste hoy. Vuelve mañana.";

        construccionSeleccionada = null;

        quitarSeleccionBotones();

    }

}

    </script>

</body>
</html>
